name: template_flutter
description: Flutter template project with Clean Architecture, Feature-first organization, and flutter_bloc
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.1.0

  # Dependency Injection
  get_it: ^9.2.1

  # Navigation
  go_router: ^17.5.0

  # Localization
  easy_localization: ^3.0.8

  # Network
  dio: ^5.11.0
  connectivity_plus: ^7.3.1

  # Functional Programming (Error Handling)
  dartz: ^0.10.1

  # Local Storage
  shared_preferences: ^2.5.5

  # Notifications
  flutter_local_notifications: ^22.3.0
  firebase_core: ^4.13.0
  firebase_messaging: ^16.4.3

  # Refresh Control
  pull_to_refresh: ^2.0.0

  # Utils
  intl: 0.20.2
  showcaseview: ^5.1.0
  flutter_screenutil: ^5.9.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/translations/en.json
    - assets/translations/ru.json
